<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ターミナル風UIで構成されたプロフィールページです。" />
    <title>Terminal Profile</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // 3D になりそうなら、cockpit.js が切り替えるまで暗い背景だけを出し、2D の配置を見せない
      if (
        "updateElementGeometry" in HTMLCanvasElement.prototype &&
        matchMedia("(min-width: 1000px) and (min-height: 600px)").matches &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      )
        document.documentElement.classList.add("tp-boot");
      // スクリプトが途中で失敗しても、隠したままにしない
      addEventListener("error", function () {
        document.documentElement.classList.remove("tp-boot");
      });
    </script>
  </head>
  <body>
    <div class="tp-page">
      <!-- ロゴヘッダー -->
      <header class="tp-header">
        <span class="tp-logo-bracket">[</span>
        <span class="tp-logo-text">Terminal like Profile</span>
        <span class="tp-logo-bracket">]</span>
        <span class="tp-logo-cursor"></span>
      </header>

      <!-- コックピット: 2D では3カラム、3D では cockpit.js がパネルを canvas に移す -->
      <div class="tp-block" id="tp-cockpit">
        <div class="tp-col tp-col-left">
          <section class="tp-win tp-panel" id="tp-panel-profile" tabindex="0" aria-labelledby="tp-t-profile">
            <div class="tp-bar"><span class="tp-bartitle" id="tp-t-profile">◈ PROFILE</span></div>
            <div class="tp-info" id="tp-info-profile"></div>
          </section>
          <section class="tp-win tp-panel" id="tp-panel-system" tabindex="0" aria-labelledby="tp-t-system">
            <div class="tp-bar"><span class="tp-bartitle" id="tp-t-system">◈ SYSTEM</span></div>
            <div class="tp-info" id="tp-info-system"></div>
          </section>
        </div>
        <div class="tp-col tp-col-main">
        <div class="tp-win tp-panel tp-panel-main" id="tp-panel-main">
          <div class="tp-bar">
            <span class="tp-dot tp-dot-r"></span>
            <span class="tp-dot tp-dot-y"></span>
            <span class="tp-dot tp-dot-g"></span>
            <span class="tp-bartitle">bash — 80×32</span>
          </div>
          <div class="tp-scroll-area" id="tp-scroll-area">
            <div class="tp-screen" id="tp-screen"></div>
            <div class="tp-typing-row" id="tp-typing-row" style="display: none">
              <span class="tp-typing-prompt" id="tp-typing-prompt"></span>
              <span class="tp-typing-text" id="tp-typing-text"></span>
              <span class="tp-cursor"></span>
            </div>
            <div class="tp-input-row" id="tp-input-row" style="display: none">
              <span class="tp-prompt-label" id="tp-prompt-label"></span>
              <div class="tp-input-wrap">
                <div
                  class="tp-input"
                  id="tp-input"
                  contenteditable="true"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  role="presentation"
                ></div>
                <span class="tp-cursor"></span>
              </div>
            </div>
          </div>
        </div>
        </div><!-- /.tp-col-main -->
        <div class="tp-col tp-col-right">
          <section class="tp-win tp-panel" id="tp-panel-projects" tabindex="0" aria-labelledby="tp-t-projects">
            <div class="tp-bar"><span class="tp-bartitle" id="tp-t-projects">◈ PROJECTS</span></div>
            <div class="tp-info" id="tp-info-projects"></div>
          </section>
          <section class="tp-win tp-panel" id="tp-panel-skills" tabindex="0" aria-labelledby="tp-t-skills">
            <div class="tp-bar"><span class="tp-bartitle" id="tp-t-skills">◈ SKILLS</span></div>
            <div class="tp-info" id="tp-info-skills"></div>
          </section>
          <section class="tp-win tp-panel" id="tp-panel-links" tabindex="0" aria-labelledby="tp-t-links">
            <div class="tp-bar"><span class="tp-bartitle" id="tp-t-links">◈ LINKS</span></div>
            <div class="tp-info" id="tp-info-links"></div>
          </section>
        </div>
        <canvas class="tp-canvas" id="tp-canvas"></canvas>
      </div><!-- /.tp-block -->
    </div><!-- /.tp-page -->

    <!-- ゲームオーバーレイ -->
    <div class="tp-overlay tp-game-overlay" id="tp-game-overlay">
      <button class="tp-game-exit" id="tp-game-exit">[ EXIT ]</button>
    </div>

    <!-- exitオーバーレイ -->
    <div class="tp-overlay tp-exit-overlay" id="tp-exit-overlay">
      <button class="tp-terminal-icon" id="tp-terminal-icon" title="Terminal">
        <span class="tp-terminal-icon-prompt">&gt;_</span>
      </button>
    </div>

    <!-- スクリプト読み込み順序: profile → commands → game → terminal → cockpit -->
    <script src="profile.js"></script>
    <script src="commands.js"></script>
    <script src="game.js"></script>
    <script src="terminal.js"></script>
    <script src="cockpit.js"></script>
  </body>
</html>
